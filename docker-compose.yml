services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-management-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - order-management-sql-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


  backend:
    container_name: order-management-backend

    build:
      context: .
      dockerfile: docker/backend.Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderManagement;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"

      Database__ApplyMigrations: "true"

    ports:
      - "5205:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    container_name: order-management-frontend

    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5205/api"

    environment:
      NODE_ENV: "production"

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  order-management-sql-data: